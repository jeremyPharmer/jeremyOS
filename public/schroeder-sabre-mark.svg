<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Webster Schroeder Sabre">
  <!-- Circular Sabre badge  royal blue + gold -->
  <circle cx="100" cy="100" r="96" fill="#0033a0"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#d4b483" stroke-width="8"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.35"/>
  <g transform="translate(100,108)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Crossed sabres -->
    <g stroke="#d4b483" stroke-width="7">
      <path d="M-52 -58 L-10 18"/>
      <path d="M52 -58 L10 18"/>
    </g>
    <g stroke="#ffffff" stroke-width="2.5" opacity="0.85">
      <path d="M-52 -58 L-10 18"/>
      <path d="M52 -58 L10 18"/>
    </g>
    <!-- Hilts -->
    <g stroke="#d4b483" stroke-width="5">
      <path d="M-18 22 L-2 8"/>
      <path d="M18 22 L2 8"/>
      <path d="M-22 12 L-6 28"/>
      <path d="M22 12 L6 28"/>
    </g>
    <!-- Helmet / torso -->
    <g fill="#d4b483" stroke="#0033a0" stroke-width="2">
      <path d="M-28 8 C-30 -18 -18 -42 0 -46 C18 -42 30 -18 28 8 L18 42 C10 52 -10 52 -18 42 Z"/>
      <rect x="-10" y="-28" width="20" height="28" rx="2" fill="#0033a0" stroke="none"/>
      <path d="M-8 -28 h16 v28 h-16 z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
      <!-- Plume -->
      <path d="M2 -46 C18 -70 34 -66 28 -48 C22 -40 10 -42 2 -46 Z" fill="#ffffff" stroke="#d4b483" stroke-width="2"/>
    </g>
    <!-- Chest S -->
    <text x="0" y="28" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Black, sans-serif" font-size="34" font-weight="700" fill="#d4b483" stroke="#0033a0" stroke-width="2">S</text>
  </g>
</svg>
